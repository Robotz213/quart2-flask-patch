[project]
name = "quart-flask-patch"
version = "0.3.1"
requires-python = ">=3.14"
description = "Quart-Flask-Patch is a Quart extension that patches Quart to work with Flask extensions."
license = "MIT"
readme = "README.rst"
dependencies = ["greenback>=1.3.0", "quart>=0.23.1", "werkzeug>=3.1.9"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
combine_as_imports = true
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = "quart_flask_patch, tests"
line_length = 100
multi_line_output = 3
no_lines_before = "LOCALFOLDER"
order_by_type = false
reverse_relative = true

[tool.mypy]
allow_redefinition = true
disallow_any_generics = false
disallow_subclassing_any = true
disallow_untyped_calls = false
disallow_untyped_defs = true
implicit_reexport = true
no_implicit_optional = true
show_error_codes = true
strict = true
strict_equality = true
strict_optional = false
warn_redundant_casts = true
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = true

[dependency-groups]
dev = ["tox"]

[tool.pytest.ini_options]
addopts = "--no-cov-on-fail --showlocals --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-crawjud = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["quart_flask_patch*"]
