[tox]
envlist = format,mypy,py314,pep8,package
isolated_build = True

[testenv]
deps =
    flask-bcrypt
    flask-caching
    flask-compress
    flask-kvsession
    flask-limiter
    flask-login
    flask-mail
    flask-oauth2-login
    flask-sqlalchemy
    flask-wtf
    pytest
    pytest-asyncio
    pytest-cov
    pytest-sugar
commands = pytest --cov=quart_flask_patch {posargs}

[testenv:format]
basepython = python3.14
deps =
    black
    isort
commands =
    black --check --diff quart_flask_patch/ tests/
    isort --check --diff quart_flask_patch/ tests

[testenv:pep8]
basepython = python3.14
deps =
    flake8
    pep8-naming
    flake8-print
commands = flake8 quart_flask_patch/ tests/

[testenv:mypy]
basepython = python3.14
deps =
    flask-bcrypt
    flask-caching
    flask-compress
    flask-kvsession
    flask-limiter
    flask-login
    flask-mail
    flask-oauth2-login
    flask-sqlalchemy
    flask-wtf
    mypy
    pytest
commands =
    mypy quart_flask_patch/

[testenv:package]
basepython = python3.14
deps =
    poetry
    twine
commands =
    poetry build
    twine check dist/*
